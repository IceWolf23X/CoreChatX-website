name: Apply wider layout

on:
  push:
    paths:
      - .github/workflows/apply-wider-layout.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Widen layout shell
        run: |
          perl -0pi -e 's#width: min\(1440px, calc\(100% - clamp\(40px, 5vw, 96px\)\)\);#width: min(1560px, calc(100% - clamp(32px, 4vw, 80px)));#g; s#width: min\(1760px, calc\(100% - clamp\(48px, 5vw, 112px\)\)\);#width: min(1840px, calc(100% - clamp(40px, 4vw, 96px)));#g' assets/styles.css
          rm -f .github/workflows/apply-wider-layout.yml
          grep -F 'width: min(1560px, calc(100% - clamp(32px, 4vw, 80px)));' assets/styles.css
          grep -F 'width: min(1840px, calc(100% - clamp(40px, 4vw, 96px)));' assets/styles.css
          git diff --check
      - name: Commit applied changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Slightly widen site layout"
            git push
          fi
