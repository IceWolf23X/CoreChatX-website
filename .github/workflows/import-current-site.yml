name: Import current website

on:
  push:
    paths:
      - .github/workflows/import-current-site.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download current site files
        run: |
          set -euo pipefail
          base="http://95.217.57.134:40557"
          mkdir -p assets
          files=(
            "README.md"
            "index.html"
            "docs.html"
            "installation.html"
            "features.html"
            "configuration.html"
            "faq.html"
            "assets/styles.css"
            "assets/site.js"
            "assets/corechatx-logo.svg"
          )
          for file in "${files[@]}"; do
            curl --fail --silent --show-error --location "$base/$file" --output "$file"
          done

      - name: Commit imported website
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/import-current-site.yml
          git add README.md index.html docs.html installation.html features.html configuration.html faq.html assets/styles.css assets/site.js assets/corechatx-logo.svg .github/workflows/import-current-site.yml
          if git diff --cached --quiet; then
            echo "No website changes to commit."
          else
            git commit -m "Import CoreChatX website files"
            git push
          fi
