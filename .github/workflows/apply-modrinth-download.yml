name: Apply Modrinth download links

on:
  push:
    paths:
      - .github/workflows/apply-modrinth-download.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update download links
        run: |
          perl -0pi -e 's#https://github\.com/IceWolf23X/CoreChatX/releases#https://modrinth.com/plugin/corechatx#g' *.html
          rm -f .github/workflows/apply-modrinth-download.yml
          if rg 'https://github\.com/IceWolf23X/CoreChatX/releases' *.html; then
            exit 1
          fi
          if ! rg 'https://modrinth.com/plugin/corechatx' *.html; then
            exit 1
          fi
      - name: Commit applied changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Point download links to Modrinth"
            git push
          fi
