name: Apply extra feature icons

on:
  push:
    paths:
      - .github/workflows/apply-extra-feature-icons.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply extra feature icon patch
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/extra-feature-icons.patch
          git apply /tmp/extra-feature-icons.patch
          rm -f .github/workflows/apply-extra-feature-icons.yml
          node --check assets/site.js
          git diff --check
      - name: Commit applied changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add icons to extra feature cards"
            git push
          fi
