name: Move layout CSS

on:
  push:
    paths:
      - .github/workflows/move-layout-css.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-layout-css:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add migrated static CSS
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('assets/styles.css')
          css = path.read_text()

          scrollbar = '''
* {
  scrollbar-width: thin;
  scrollbar-color: rgba(124, 140, 255, 0.72) rgba(8, 11, 24, 0.74);
}

*::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}

*::-webkit-scrollbar-track {
  background: rgba(8, 11, 24, 0.72);
  border-radius: 999px;
}

*::-webkit-scrollbar-thumb {
  border: 2px solid rgba(8, 11, 24, 0.92);
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(124, 140, 255, 0.82), rgba(155, 109, 255, 0.76));
}

*::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(180deg, rgba(151, 163, 255, 0.95), rgba(172, 132, 255, 0.9));
}
'''
          if 'scrollbar-color: rgba(124, 140, 255, 0.72)' not in css:
              css = css.replace('* {\n  box-sizing: border-box;\n}\n', '* {\n  box-sizing: border-box;\n}\n' + scrollbar, 1)

          css = css.replace('width: min(1180px, calc(100% - 40px));', 'width: min(1440px, calc(100% - clamp(40px, 5vw, 96px)));')

          if '.doc-page .shell {' not in css:
              css = css.replace('.doc-layout {\n', '.doc-page .shell {\n  width: min(1760px, calc(100% - clamp(48px, 5vw, 112px)));\n}\n\n.doc-layout {\n', 1)

          css = css.replace('grid-template-columns: 270px minmax(0, 1fr);', 'grid-template-columns: minmax(240px, 300px) minmax(0, 1fr) minmax(260px, 320px);', 1)
          css = css.replace('gap: 34px;\n  align-items: start;', 'gap: clamp(24px, 2vw, 46px);\n  align-items: start;', 1)

          css = css.replace('.doc-sidebar {\n  position: sticky;', '.doc-sidebar,\n.resource-sidebar {\n  position: sticky;', 1)
          css = css.replace('  overflow: auto;\n  display: grid;', '  overflow: auto;\n  scrollbar-gutter: stable;\n  display: grid;', 1)
          css = css.replace('.doc-sidebar strong {\n  color: var(--text);', '.doc-sidebar strong,\n.resource-sidebar > strong {\n  color: var(--text);', 1)

          resource_styles = '''
.resource-sidebar {
  gap: 10px;
}

.side-resource-card {
  display: block;
  border: 1px solid rgba(139, 150, 255, 0.14);
  border-radius: var(--radius-sm);
  background: rgba(8, 11, 24, 0.34);
  padding: 14px;
  transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
}

.side-resource-card:hover,
.side-resource-card:focus-visible {
  transform: translateY(-2px);
  border-color: var(--line-strong);
  background: rgba(24, 28, 49, 0.7);
}

.side-resource-card.is-current {
  border-color: rgba(151, 126, 255, 0.46);
  background: rgba(139, 150, 255, 0.1);
}

.side-resource-card span {
  display: inline-block;
  width: fit-content;
  border: 1px solid rgba(151, 126, 255, 0.3);
  border-radius: 999px;
  color: var(--accent);
  font-size: 0.72rem;
  font-weight: 900;
  line-height: 1;
  margin-bottom: 12px;
  padding: 5px 8px;
}

.side-resource-card h3 {
  margin-bottom: 7px;
  font-size: 0.96rem;
}

.side-resource-card p {
  color: var(--muted);
  font-size: 0.86rem;
  line-height: 1.45;
  margin: 0;
}
'''
          marker = '.doc-sidebar a:hover,\n.doc-sidebar a:focus-visible {\n  background: rgba(139, 150, 255, 0.1);\n  color: var(--text);\n}\n'
          if '.side-resource-card {' not in css:
              css = css.replace(marker, marker + resource_styles, 1)

          css = css.replace('.code-block {\n  overflow-x: auto;', '.code-block {\n  overflow-x: auto;\n  max-width: 100%;\n  scrollbar-gutter: stable;', 1)
          css = css.replace('  .doc-sidebar {\n    position: static;\n    max-height: none;\n  }', '  .doc-sidebar,\n  .resource-sidebar {\n    position: static;\n    max-height: none;\n  }', 1)

          path.write_text(css)
          PY

      - name: Validate JavaScript
        run: node --check assets/site.js

      - name: Commit CSS migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/move-layout-css.yml
          git add assets/styles.css .github/workflows/move-layout-css.yml
          if git diff --cached --quiet; then
            echo "No CSS migration changes to commit."
          else
            git commit -m "Move static layout CSS into stylesheet"
            git push
          fi
